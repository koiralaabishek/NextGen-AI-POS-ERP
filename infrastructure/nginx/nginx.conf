events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    upstream django_backend {
        server backend:8000;
    }

    upstream fastapi_ai {
        server ai_service:8001;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 20M;

        # Core Django REST API & OpenAPI Docs
        location /api/ {
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django Admin
        location /admin/ {
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # FastAPI AI Intelligence microservice
        location /ai/ {
            rewrite ^/ai/(.*) /$1 break;
            proxy_pass http://fastapi_ai;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Default fallback
        location / {
            return 200 'NextGen AI POS & ERP API Gateway is active.\nAccess Swagger UI at /api/docs/ or POS Terminal at port 3001.\n';
            add_header Content-Type text/plain;
        }
    }
}
