      - id
      - password
    Warehouse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        branch:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 150
        code:
          type: string
          maxLength: 50
        is_primary:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - branch
      - code
      - created_at
      - id
      - name
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
