components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        account_code:
          type: string
          maxLength: 50
        account_name:
          type: string
          maxLength: 150
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        parent_account:
          type: string
          format: uuid
          nullable: true
        is_active:
          type: boolean
      required:
      - account_code
      - account_name
      - account_type
      - id
    AccountTypeEnum:
      enum:
      - ASSET
      - LIABILITY
      - EQUITY
      - REVENUE
      - EXPENSE
      type: string
      description: |-
        * `ASSET` - Asset
        * `LIABILITY` - Liability
        * `EQUITY` - Equity
        * `REVENUE` - Revenue
        * `EXPENSE` - Expense
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor_email:
          type: string
          format: email
          readOnly: true
        action:
          type: string
          maxLength: 100
        resource_type:
          type: string
          maxLength: 100
        resource_id:
          type: string
          maxLength: 100
        before_state:
          nullable: true
        after_state:
          nullable: true
        ip_address:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_email
      - id
      - resource_id
      - resource_type
      - timestamp
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        code:
          type: string
          maxLength: 50
        address:
          type: string
        phone:
          type: string
          maxLength: 32
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        is_active:
          type: boolean
        is_headquarters:
          type: boolean
        warehouses:
          type: array
          items:
            $ref: '#/components/schemas/Warehouse'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - warehouses
    Brand:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          maxLength: 180
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - id
      - name
      - slug
    BusinessSettings:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        settings_json:
          description: 'Configurable settings: receipt_format, tax_included, low_stock_threshold,
            offline_sync_policy'
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - updated_at
    BusinessTypeEnum:
      enum:
      - retail
      - supermarket
      - restaurant
      - wholesale
      type: string
      description: |-
        * `retail` - Retail
        * `supermarket` - Supermarket
        * `restaurant` - Restaurant
        * `wholesale` - Wholesale & Distribution
    CashierShift:
      type: object
      properties:
