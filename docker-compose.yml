version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: nextgen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextgen_pos_db
      POSTGRES_USER: nextgen_user
      POSTGRES_PASSWORD: nextgen_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextgen_user -d nextgen_pos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nextgen_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextgen_django
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgres://nextgen_user:nextgen_password@db:5432/nextgen_pos_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - USE_SQLITE=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextgen_celery
    restart: unless-stopped
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://nextgen_user:nextgen_password@db:5432/nextgen_pos_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - backend
      - redis

  ai_service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: nextgen_ai
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./ai-service:/app
    environment:
      - PORT=8001

  nginx:
    image: nginx:alpine
    container_name: nextgen_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - ai_service

volumes:
  postgres_data:
